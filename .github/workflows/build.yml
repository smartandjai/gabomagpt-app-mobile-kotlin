name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Récupérer le code
      uses: actions/checkout@v4

    - name: Configurer Java 17
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '17'

    - name: Générer local.properties avec secrets
      run: |
        echo "# GitHub Actions Secrets" > local.properties
        echo "sdk.dir=$ANDROID_HOME" >> local.properties
        echo "GROQ_API_KEY=${{ secrets.GROQ_API_KEY }}" >> local.properties
        echo "TAVILY_API_KEY=${{ secrets.TAVILY_API_KEY }}" >> local.properties

    - name: Rendre gradlew exécutable
      run: chmod +x ./gradlew

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v4
      with:
        gradle-version: '9.4.1'

    - name: Générer le wrapper Gradle si absent
      run: |
        if [ ! -f gradle/wrapper/gradle-wrapper.jar ]; then
          gradle wrapper --gradle-version=9.4.1
        fi

    - name: Builder l'APK de Debug
      run: ./gradlew assembleDebug --no-daemon --stacktrace

    - name: Stocker l'APK généré
      uses: actions/upload-artifact@v4
      with:
        name: app-debug-apk
        path: app/build/outputs/apk/debug/app-debug.apk
